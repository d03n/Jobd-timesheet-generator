<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job-D timesheet builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --paper:#EEF0F2; --surface:#FFFFFF; --sunk:#F5F6F8; --ink:#1C2128; --muted:#5B6571; --line:#D3D8DE;
  --silver:#C9CDD3; --accent:#1A3DB8; --accent-ink:#FFFFFF; --hi:#FFE83D; --hi-ink:#1C2128;
  --ok:#2C7A4B; --warn:#A86A12; --bad:#B42318; --holiday:#E4E6E9;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4","Book Antiqua",Palatino,Georgia,serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171B; --surface:#1D2127; --sunk:#181B20; --ink:#E8EBEF; --muted:#9AA3AE; --line:#333A43;
    --silver:#3B424B; --accent:#8FA8FF; --accent-ink:#0E1424; --hi:#E3CC2A; --hi-ink:#16181B;
    --ok:#5BC48A; --warn:#E5AA4D; --bad:#F27D70; --holiday:#2A2F36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171B; --surface:#1D2127; --sunk:#181B20; --ink:#E8EBEF; --muted:#9AA3AE; --line:#333A43;
  --silver:#3B424B; --accent:#8FA8FF; --accent-ink:#0E1424; --hi:#E3CC2A; --hi-ink:#16181B;
  --ok:#5BC48A; --warn:#E5AA4D; --bad:#F27D70; --holiday:#2A2F36; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font:700 1.3rem/1.15 var(--serif);margin:0;letter-spacing:.005em}
.brand small{color:var(--muted);font-size:.85rem}
.sync{color:var(--muted);font-size:.8rem;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--bad);background:transparent}
.btn[disabled]{opacity:.55;cursor:default}

/* layout */
main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;padding:20px;max-width:1320px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr);padding:12px;gap:14px}.bar{padding:10px 12px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* calendar */
.monthnav{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
.monthnav h2{font:700 1.15rem/1.2 var(--serif);margin:0 auto 0 4px}
.iconbtn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem;line-height:1}
.iconbtn:hover{background:var(--sunk)}
.monthpick{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--surface);font-size:.85rem;max-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px 12px 14px}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.day{position:relative;aspect-ratio:1/1;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;
  padding:4px 5px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.day:hover{border-color:var(--muted)}
.day .n{font-weight:600;font-size:.86rem;line-height:1}
.day .amt{font-size:.68rem;color:var(--muted);align-self:flex-end;line-height:1;font-variant-numeric:tabular-nums}
.day .fillbar{position:absolute;left:0;bottom:0;height:4px;width:calc(var(--f,0) * 100%);background:var(--ok)}
.day.partial .fillbar{background:var(--warn)}
.day.over .fillbar{background:var(--bad);width:100%}
.day.over .amt{color:var(--bad);font-weight:700}
.day.weekend{background:var(--sunk)}
.day.weekend .n{color:var(--muted)}
.day.holiday{background:repeating-linear-gradient(135deg,var(--holiday) 0 6px,var(--surface) 6px 12px)}
.day.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.day.sel{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 14px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:5px}

/* summary */
.sumhead{background:var(--hi);color:var(--hi-ink);display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px;border-radius:8px 8px 0 0}
.sumhead h2{font:700 1.05rem/1.2 var(--serif);margin:0}
.sumhead b{font-variant-numeric:tabular-nums}
.sumrows{padding:6px 14px 12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 52px 58px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.srow:last-child{border-bottom:0}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .v{text-align:right;font-variant-numeric:tabular-nums}
.srow .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .track{grid-column:1/-1;height:3px;background:var(--sunk);border-radius:2px;margin-top:-2px}
.srow .track span{display:block;height:100%;background:var(--accent);border-radius:2px}
.srow.leave .track span{background:var(--muted)}
.srow.zero{color:var(--muted)}
.sumnote{font-size:.8rem;color:var(--muted);padding:0 14px 12px}
.sumnote.warn{color:var(--warn)}

/* editor */
.edhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--silver);border-radius:8px 8px 0 0}
.edhead h2{font:700 1.35rem/1.2 var(--serif);margin:0;margin-right:auto}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:6px;padding:2px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.daymeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.pill{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok)} .pill.partial{color:var(--warn)} .pill.over{color:var(--bad);border-color:var(--bad)}
.holidayfld{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex:1;min-width:220px}
.holidayfld input{flex:1;min-width:0}
.recs{padding:6px 18px 4px}
.rec{border-bottom:1px solid var(--line);padding:14px 0}
.rec:last-child{border-bottom:0}
.rec-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.rec-n{font-weight:700;font-size:.82rem;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.76rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.rec-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 90px 92px;gap:10px;margin-top:10px}
@media (max-width:1050px){.rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
output.util{display:block;padding:7px 9px;border:1px dashed var(--line);border-radius:6px;font-variant-numeric:tabular-nums;background:var(--sunk)}
.missing{border-color:var(--warn)!important}
.edfoot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 18px}
.empty{padding:28px 18px;color:var(--muted)}
.empty p{margin:0 0 12px;max-width:52ch}

/* month table */
.tablewrap{overflow-x:auto;padding:4px 0 8px}
table.month{border-collapse:collapse;width:100%;min-width:760px;font-size:.86rem}
table.month th{background:var(--silver);text-align:left;padding:7px 8px;font-weight:700;font-size:.78rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.month td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.month td.num,table.month th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.month tr.clickable{cursor:pointer}
table.month tr.clickable:hover td{background:var(--sunk)}
table.month tr.hol td{background:var(--holiday)}
table.month .cust{color:var(--accent);font-weight:700}
table.month tr.tot td{font-weight:700;border-bottom:0}
.tag{font-weight:700;color:var(--accent)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px 24px;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(760px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.narrow{width:min(440px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font:700 1.2rem/1.2 var(--serif);margin:0}
.modal .body{padding:16px 18px;display:flex;flex-direction:column;gap:22px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.sec h3{font:700 1rem/1.3 var(--serif);margin:0 0 4px}
.sec p.hint{margin:0 0 10px;color:var(--muted);font-size:.84rem;max-width:65ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}}
.listed{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center}
.lrow.leave{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto}
.lrow .iconbtn{width:30px;height:30px;font-size:.9rem}
.addrow{display:flex;gap:6px;margin-top:8px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.calbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 12px 6px}
.calbar .btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.calhint{font-size:.75rem;color:var(--muted)}
.day.sel{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.clipbar{display:flex;align-items:center;gap:10px;padding:8px 18px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-bottom:1px solid var(--line);font-size:.85rem}
.cliplabel{font-weight:700;color:var(--accent)}
.cliptext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-actions{display:flex;gap:4px}
.bulk{padding:14px 18px 16px;border-bottom:2px solid var(--line);background:var(--sunk)}
.bulk h3{font:700 1rem/1.3 var(--serif);margin:0 0 8px}
.bulk .hint{margin:8px 0 0;font-size:.8rem;color:var(--muted)}
.bulkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mday{border-bottom:1px solid var(--line)}
.mdayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px 0}
.mdayhead .spacer{flex:1}
.linkish{border:0;background:none;padding:0;cursor:pointer;font:700 1.02rem/1.3 var(--serif);color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkish:hover{text-decoration-color:var(--ink)}
.mday .recs{padding-top:0}
.mday .none{color:var(--muted);font-size:.88rem;margin:8px 0 14px}
.sumhead small{font:500 .78rem/1 var(--sans);margin-left:6px;opacity:.75}
table.month.edit{min-width:780px;table-layout:fixed}
table.month.edit td{padding:5px 4px;vertical-align:top}
table.month.edit th{padding:7px 4px}
table.month.edit tr.daystart td{border-top:2px solid var(--line)}
table.month.edit input,table.month.edit select,table.month.edit textarea{padding:5px 6px;font-size:.84rem}
table.month.edit select{padding-right:2px}
table.month.edit textarea{min-height:38px;resize:vertical}
.datecell{background:var(--sunk);white-space:nowrap}
.datecell .wdname{display:block;font-size:.72rem;color:var(--muted);margin:2px 0 6px}
.linkish.small{font:600 .82rem/1.2 var(--sans)}
.addrowbtn{padding:3px 7px;font-size:.74rem}
.custsel{color:var(--accent);font-weight:700}
.actsin{display:flex;flex-direction:column;gap:3px;align-items:center}
td.acts .iconbtn{width:28px;height:28px;font-size:.85rem}
table.month output{font-variant-numeric:tabular-nums}
.day.pubhol .amt{color:var(--ink);font-weight:700;letter-spacing:.02em}
.legend .holkey{height:10px;width:14px;background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px)}
.holnote{font-size:.75rem;color:var(--muted);padding:0 14px 14px;margin-top:-6px}
.holbanner{padding:10px 18px;background:var(--holiday);border-bottom:1px solid var(--line);font-size:.88rem}
.addrow input[type=date]{max-width:160px}
.checkbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,66px));z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 18px;background:var(--ink);color:var(--surface)}
.checkbar[hidden]{display:none}
.checkbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.checkbar .btn.danger{background:var(--bad);color:#fff}
.checkbar .btn.quiet2{background:transparent;color:var(--surface)}
.checkcount{font-weight:700;margin-right:auto}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.btn.quiet2{border-color:transparent;background:transparent;color:var(--muted)}
.rec-n{display:flex;align-items:center;gap:6px;cursor:pointer}
.reccheck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.rec.checked{background:color-mix(in srgb,var(--bad) 6%,transparent);box-shadow:inset 3px 0 0 var(--bad);padding-left:10px;margin-left:-10px}
table.month.edit tr.checked td{background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
table.month.edit th.acts{text-align:center}
.toast.actionable{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toastbtn{border:0;background:none;color:var(--hi);font-weight:700;cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.exopts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.exopt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.exopt input{margin-top:3px;accent-color:var(--accent)}
.exopt span{display:flex;flex-direction:column;gap:2px}
.exopt small{color:var(--muted);font-size:.82rem}
.exopt.disabled{opacity:.5;cursor:default}

/* ---- UX pass: z-index scale 10 header · 20 sticky bars · 50 overlays · 60 toast ---- */
.skip{position:absolute;left:12px;top:-60px;z-index:70;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.bar{gap:12px}
.brand small{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.brand .sync{font-size:.8rem}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out;touch-action:manipulation;user-select:none}
.btn svg,.iconbtn svg{width:18px;height:18px;flex:none}
.btn.small{min-height:32px}
.btn.small svg{width:16px;height:16px}
.btn:active:not([disabled]){filter:brightness(.94)}
.btn[aria-busy="true"]{cursor:progress}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink);touch-action:manipulation}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn.del:hover{color:var(--bad);border-color:var(--bad)}
.tabs button{min-height:34px}
.day{touch-action:manipulation}
.day .amt{font-size:.75rem}
.cal .wd{font-size:.78rem}
.calhint,.legend,.holnote,.datecell .wdname{font-size:.78rem}
.fld>span{font-size:.8rem}
.day:focus-visible{outline:3px solid var(--accent);outline-offset:2px;z-index:1}
.stickyhead{position:sticky;top:0;background:var(--surface);z-index:2;border-radius:10px 10px 0 0}
.exlegend{font-weight:700;font-size:.85rem;margin-bottom:8px;padding:0}
.seg{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.seg .exlegend{width:100%}
.seg label{flex:1;min-width:120px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--line);border-radius:8px;font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.edfoot.danger-zone{border-top:1px solid var(--line);justify-content:flex-end}
:root{--warn:#8F5B0C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#E5AA4D}}
:root[data-theme="dark"]{--warn:#E5AA4D}

/* phones and narrow windows */
@media (max-width:720px){
  .bar{position:static;padding:10px 12px}
  body::before{display:none}
  .brand{width:100%}
  .actions{width:100%}
  .actions .btn{flex:1 1 0;min-width:0;padding:8px 8px;gap:5px}
  .actions .btn.primary{flex:1 1 0}
  .actions .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions .btn{font-size:.86rem;letter-spacing:-.005em;padding:8px 4px;gap:4px}
  .actions .btn svg{width:16px;height:16px}
  .monthpick{display:none}
  .monthnav h2{white-space:nowrap}
  .col{display:contents}
  .calpanel{order:1}
  #editor{order:2}
  .sumpanel{order:3}
  .edhead{padding:12px 14px 10px}
  .edhead h2{font-size:1.15rem;width:100%}
  .tabs{width:100%}
  .tabs button{flex:1}
  .recs,.daymeta,.edfoot,.bulk,.mdayhead{padding-left:14px;padding-right:14px}
  .rec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .checkbar{top:0;padding:8px 12px}

<script>

    '2027-02-22': 'Substitution for Makha Bucha Day',
    '2027-04-06': 'Chakri Memorial Day',
    '2027-04-13': 'Songkran Festival',
    '2027-04-14': 'Songkran Festival',
    '2027-04-15': 'Songkran Festival',
    '2027-05-03': 'Substitution for National Labour Day',
    '2027-05-04': 'Coronation Day',
    '2027-05-20': 'Visakha Bucha Day',
    '2027-06-03': 'H.M. Queen Suthida’s Birthday',
    '2027-07-19': 'Substitution for Asarnha Bucha Day',
    '2027-07-28': 'H.M. King Maha Vajiralongkorn’s Birthday',
    '2027-08-12': 'H.M. Queen Sirikit the Queen Mother’s Birthday and Mother’s Day',
    '2027-10-13': 'H.M. King Bhumibol Adulyadej the Great Memorial Day',
    '2027-10-25': 'Substitution for King Chulalongkorn the Great Memorial Day',
    '2027-12-06': 'Substitution for National Day and Father’s Day',
    '2027-12-10': 'Constitution Day',
    '2027-12-31': 'New Year’s Eve'
  }
};
/* Returns {name, source} for a public/bank holiday on this date, or null. */
function holidayInfo(settings, key) {
  var custom = (settings.customHolidays || []).filter(function (c) { return c.date === key; })[0];
  if (custom) return { name: custom.name || 'Holiday', source: 'custom' };
  if (settings.useBotHolidays === false) return null;
  var v = BOT_HOLIDAYS.days[key];
  if (!v) return null;
  if (typeof v === 'object') { if (v.bangkok && settings.botBangkok === false) return null; return { name: v.name, source: 'bot' }; }
  return { name: v, source: 'bot' };
}
function holidayName(settings, key) { var i = holidayInfo(settings, key); return i ? i.name : ''; }
/* ---- Timesheet workbook generator: builds the Job-D sheet with live Excel formulas ---- */
var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function listedDates(settings, ym, month, only) {
  if (only) return only.slice().sort();
  var p = ym.split('-'), y = +p[0], m = +p[1];
  var n = new Date(y, m, 0).getDate(), out = [];
  for (var d = 1; d <= n; d++) {
    var key = ym + '-' + String(d).padStart(2, '0');
    var day = (month.days && month.days[key]) || null;
    var wd = new Date(y, m - 1, d).getDay();
    var hasRecs = day && day.records && day.records.length > 0;
    var weekday = wd !== 0 && wd !== 6;
    if (hasRecs || (day && day.holiday) || holidayName(settings, key) || (settings.includeWeekdays && weekday)) out.push(key);
  }
  return out;
}

function buildWorkbook(ExcelJS, settings, ym, month, only) {
  var FONT = 'Book Antiqua';
  var BLUE = 'FF0000CC', SILVER = 'FFC0C0C0', YELLOW = 'FFFFFF00', GREY = 'FFD9D9D9';
  var thin = { style: 'thin' }, med = { style: 'medium' };
  var box = { top: thin, left: thin, bottom: thin, right: thin };
  var p = ym.split('-'), y = +p[0], mo = +p[1];
  var sheetName = 'JobD-' + MONTHS_SHORT[mo - 1] + '-' + y;

  var wb = new ExcelJS.Workbook();
  wb.creator = 'Job-D Timesheet Builder';
  var ws = wb.addWorksheet(sheetName, {
    pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 } }
  });
  [5, 15.375, 72.375, 17.5, 14.875, 15.625, 10, 11.25].forEach(function (w, i) { ws.getColumn(i + 1).width = w; });

  function f(size, bold, color) { var o = { name: FONT, size: size, bold: !!bold }; if (color) o.color = { argb: color }; return o; }
  function fill(c) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: c } }; }
  function esc(s) { return String(s).replace(/"/g, '""'); }
  function round(n) { return Math.round(n * 1000) / 1000; }

  // Title
  ws.mergeCells('A1:H1');
  var t1 = ws.getCell('A1');
  t1.value = { richText: [
    { text: settings.titleLeft || 'SILVERLAKE', font: { name: 'Cooper Black', size: 24, bold: true, color: { argb: 'FF808080' } } },
    { text: '                   ' + (settings.titleRight || 'TIME SHEET'), font: { name: 'Cooper Black', size: 24, bold: true } }
  ] };
  t1.alignment = { horizontal: 'left', vertical: 'middle' };
  ws.getRow(1).height = 30.6;

  // Staff name / sign
  var b3 = ws.getCell('B3');
  b3.value = 'Staff Name: ' + (settings.staffName || '');
  b3.font = f(18, true);
  b3.border = { left: med, top: med, bottom: med };
  ws.getCell('C3').border = { top: med, bottom: med };
  ws.getCell('D3').border = { top: med, bottom: med, right: med };
  var e3 = ws.getCell('E3');
  e3.value = 'Sign & Date';
  e3.font = f(18);
  e3.alignment = { horizontal: 'right' };
  ['F3', 'G3', 'H3'].forEach(function (a) { ws.getCell(a).border = { bottom: thin }; });
  ws.getRow(3).height = 24;

  // Header (rows 5-6)
  var heads = [['B', 'Date', 14], ['C', 'Job Description', 16], ['D', 'IR/CR \nRef#', 14], ['E', 'Category', 14],
               ['F', 'Customer', 14], ['G', '#\n DAYS', 12], ['H', '% of \nUtilization', 14]];
  heads.forEach(function (h) {
    ws.mergeCells(h[0] + '5:' + h[0] + '6');
    var c = ws.getCell(h[0] + '5');
    c.value = h[1]; c.font = f(h[2], true); c.fill = fill(SILVER); c.border = box;
    c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  });
  ws.getRow(5).height = 24; ws.getRow(6).height = 24;

  // Build rows
  var dates = listedDates(settings, ym, month, only);
  var rows = [];
  dates.forEach(function (key) {
    var day = (month.days && month.days[key]) || { records: [] };
    var recs = (day.records || []);
    if (!recs.length) rows.push({ date: key, holiday: day.holiday || holidayName(settings, key) });
    else recs.forEach(function (r, i) { rows.push({ date: i === 0 ? key : null, rec: r }); });
  });
  var spare = Math.max(0, parseInt(settings.spareRows, 10) || 0);
  for (var s = 0; s < spare; s++) rows.push({ date: null });
  if (!rows.length) rows.push({ date: null });

  var first = 7, last = first + rows.length - 1;
  var tRow = last + 1, sRow = tRow + 1;
  var custs = settings.customers || [], leaves = settings.leaves || [], cats = settings.categories || [];
  var custStart = sRow + 1, custEnd = custStart + custs.length - 1;
  var leaveStart = custEnd + 1, leaveEnd = leaveStart + leaves.length - 1;
  var catLabel = leaveEnd + 2, catStart = catLabel + 1, catEnd = catStart + cats.length - 1;

  var total = 0;
  rows.forEach(function (r) { if (r.rec) total += (+r.rec.days || 0); });
  total = round(total);

  var G = '$G$' + first + ':$G$' + last, F = '$F$' + first + ':$F$' + last, E = '$E$' + first + ':$E$' + last;

  rows.forEach(function (r, i) {
    var n = first + i, row = ws.getRow(n);
    var rec = r.rec || {};
    var cB = row.getCell(2), cC = row.getCell(3), cD = row.getCell(4), cE = row.getCell(5),
        cF = row.getCell(6), cG = row.getCell(7), cH = row.getCell(8);
    if (r.date) { var q = r.date.split('-'); cB.value = new Date(Date.UTC(+q[0], +q[1] - 1, +q[2])); }
    cB.numFmt = 'dd/mm/yyyy'; cB.font = f(12); cB.alignment = { horizontal: 'center', vertical: 'top', wrapText: true };

    var desc = r.rec ? (rec.desc || '') : (r.holiday || '');
    var m = /^(\[[^\]]+\])([\s\S]*)$/.exec(desc);
    if (m) cC.value = { richText: [{ text: m[1], font: f(14, true, BLUE) }, { text: m[2], font: f(14) }] };
    else if (desc) cC.value = desc;
    cC.font = f(14); cC.alignment = { horizontal: 'left', vertical: 'top', wrapText: true };

    if (rec.ref) cD.value = rec.ref;
    cD.font = f(12); cD.alignment = { horizontal: 'center', vertical: 'top', wrapText: true };
    if (rec.cat) cE.value = rec.cat;
    cE.font = f(12); cE.alignment = { horizontal: 'center', vertical: 'top', wrapText: true };
    if (rec.cust) cF.value = rec.cust;
    cF.font = f(12, true, BLUE); cF.alignment = { horizontal: 'center', vertical: 'top', wrapText: true };
    var dv = (rec.days === '' || rec.days == null) ? null : +rec.days;
    if (dv != null && !isNaN(dv)) cG.value = dv;
    cG.numFmt = '0.0#'; cG.font = f(14); cG.alignment = { horizontal: 'center', vertical: 'top' };
    cH.value = { formula: 'IF((G' + n + ')>0,(G' + n + ')/($G$' + tRow + '),"")',
                 result: (dv > 0 && total > 0) ? dv / total : '' };
    cH.numFmt = '0.0%'; cH.font = f(14); cH.alignment = { horizontal: 'center', vertical: 'top' };

    [cB, cC, cD, cE, cF, cG, cH].forEach(function (c) {
      c.border = box;
      if (!r.rec && r.holiday) c.fill = fill(GREY);
    });
    if (cats.length) cE.dataValidation = { type: 'list', allowBlank: true, formulae: ['$C$' + catStart + ':$C$' + catEnd],
      showErrorMessage: true, errorTitle: 'Category', error: 'Pick a category from the list.' };
    if (custs.length) cF.dataValidation = { type: 'list', allowBlank: true, formulae: ['$C$' + custStart + ':$C$' + custEnd],
      showErrorMessage: true, errorTitle: 'Customer', error: 'Pick a customer from the list.' };

    // estimate row height for wrapped text
    var lines = Math.max(1, Math.ceil(desc.length / 52), Math.ceil(String(rec.ref || '').length / 15));
    row.height = lines > 1 ? lines * 18 : 18.75;
  });

  // TOTAL row
  var ft = ws.getCell('F' + tRow); ft.value = 'TOTAL'; ft.font = f(14, true); ft.fill = fill(SILVER);
  ft.alignment = { horizontal: 'center', vertical: 'middle' }; ft.border = box;
  var gt = ws.getCell('G' + tRow); gt.value = { formula: 'SUM(G' + first + ':G' + last + ')', result: total };
  gt.numFmt = '0.0#'; gt.font = f(14); gt.alignment = { horizontal: 'center', vertical: 'middle' }; gt.border = box;
  var ht = ws.getCell('H' + tRow); ht.value = { formula: 'IF((G' + tRow + ')>0,(G' + tRow + ')/($G$' + tRow + '),"")', result: total > 0 ? 1 : '' };
  ht.numFmt = '0%'; ht.font = f(14); ht.alignment = { horizontal: 'center', vertical: 'middle' }; ht.border = box;
  ws.getRow(tRow).height = 25.5;

  // SUMMARY band
  for (var col = 2; col <= 8; col++) ws.getRow(sRow).getCell(col).fill = fill(YELLOW);
  var sb = ws.getCell('B' + sRow); sb.value = 'SUMMARY'; sb.font = f(14, true); sb.alignment = { horizontal: 'center' };
  var sd = ws.getCell('D' + sRow); sd.value = '#Days'; sd.font = f(14, true); sd.alignment = { horizontal: 'right' };
  var sf = ws.getCell('F' + sRow); sf.value = '%'; sf.font = f(14, true); sf.alignment = { horizontal: 'center' };

  function catRef(cat) {
    var i = cats.indexOf(cat);
    return i >= 0 ? '$C$' + (catStart + i) : '"' + esc(cat) + '"';
  }
  function sumBy(pred) {
    var t = 0; rows.forEach(function (r) { if (r.rec && pred(r.rec)) t += (+r.rec.days || 0); }); return round(t);
  }
  var leaveCats = leaves.map(function (l) { return l.category; }).filter(Boolean);

  custs.forEach(function (name, i) {
    var n = custStart + i;
    var c = ws.getCell('C' + n); c.value = name; c.font = f(14);
    var formula = 'SUMIF(' + F + ',$C$' + n + ',' + G + ')';
    leaveCats.forEach(function (lc) { formula += '-SUMIFS(' + G + ',' + F + ',$C$' + n + ',' + E + ',' + catRef(lc) + ')'; });
    var val = sumBy(function (r) { return r.cust === name && leaveCats.indexOf(r.cat) < 0; });
    var d = ws.getCell('D' + n); d.value = { formula: formula, result: val }; d.numFmt = '0.0#'; d.font = f(14);
    var pc = ws.getCell('F' + n); pc.value = { formula: 'IF($G$' + tRow + '>0,D' + n + '/$G$' + tRow + ',0)', result: total > 0 ? val / total : 0 };
    pc.numFmt = '0.0%'; pc.font = f(14); pc.alignment = { horizontal: 'center' };
    ws.getRow(n).height = 27.6;
  });
  leaves.forEach(function (l, i) {
    var n = leaveStart + i;
    var c = ws.getCell('C' + n); c.value = l.label || l.category; c.font = f(14);
    var val = sumBy(function (r) { return r.cat === l.category; });
    var d = ws.getCell('D' + n); d.value = { formula: 'SUMIF(' + E + ',' + catRef(l.category) + ',' + G + ')', result: val };
    d.numFmt = '0.0#'; d.font = f(14);
    var pc = ws.getCell('F' + n); pc.value = { formula: 'IF($G$' + tRow + '>0,D' + n + '/$G$' + tRow + ',0)', result: total > 0 ? val / total : 0 };
    pc.numFmt = '0.0%'; pc.font = f(14); pc.alignment = { horizontal: 'center' };
    ws.getRow(n).height = 27.6;
  });

/* ---- PDF export: same layout and numbers as the Excel sheet ---- */
function computeSheet(settings, ym, month, only) {
  var dates = listedDates(settings, ym, month, only), rows = [];

    var day = (month.days && month.days[key]) || { records: [] };
    var recs = day.records || [];

    else recs.forEach(function (r, i) { rows.push({ date: i === 0 ? key : null, rec: r }); });

  var leaveCats = (settings.leaves || []).map(function (l) { return l.category; }).filter(Boolean);
  function sumBy(pred) { var t = 0; rows.forEach(function (r) { if (r.rec && pred(r.rec)) t += (+r.rec.days || 0); }); return Math.round(t * 1000) / 1000; }

    return { name: c, days: sumBy(function (r) { return r.cust === c && leaveCats.indexOf(r.cat) < 0; }), leave: false };
  }).concat((settings.leaves || []).map(function (l) {

function fmtDays(n) { n = Math.round((+n || 0) * 100) / 100; return n % 1 === 0 ? n.toFixed(1) : String(n); }
function fmtPct(n, d) { return (d > 0 ? (n / d * 100) : 0).toFixed(1) + '%'; }
function fmtDMY(key) { var p = key.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

function buildPdf(jsPDF, settings, ym, month, only) {

  var W = doc.internal.pageSize.getWidth(), M = 32;

  doc.setFont('times', 'bold'); doc.setFontSize(20);
  doc.setTextColor(128, 128, 128); doc.text(settings.titleLeft || 'SILVERLAKE', M, 44);
  doc.setTextColor(0, 0, 0); doc.text(settings.titleRight || 'TIME SHEET', W / 2 - 20, 44);
  doc.setFontSize(12);
  var staff = 'Staff Name: ' + (settings.staffName || '');
  doc.setLineWidth(1.2); doc.rect(M, 58, 300, 22); doc.text(staff, M + 6, 73);
  doc.setFont('times', 'normal'); doc.text('Sign & Date', 360, 73);

  var body = data.rows.map(function (r) {
    var rec = r.rec || {}, d = r.rec ? (+rec.days || 0) : 0;

      hol: !r.rec && !!r.holiday,
      cells: [r.date ? fmtDMY(r.date) : '', r.rec ? (rec.desc || '') : (r.holiday || ''), rec.ref || '', rec.cat || '',
              rec.cust || '', r.rec && rec.days !== '' && rec.days != null ? fmtDays(rec.days) : '',
              d > 0 && data.total > 0 ? fmtPct(d, data.total) : '']
    };
  });
  var holRows = {};
  body.forEach(function (b, i) { if (b.hol) holRows[i] = 1; });
  var rowsOut = body.map(function (b) { return b.cells; });
  rowsOut.push(['', '', '', '', 'TOTAL', fmtDays(data.total), data.total > 0 ? '100%' : '']);
  var lastIdx = rowsOut.length - 1;

  doc.autoTable({
    startY: 92, margin: { left: M, right: M },
    head: [['Date', 'Job Description', 'IR/CR Ref#', 'Category', 'Customer', '# Days', '% of Utilization']],
    body: rowsOut, theme: 'grid',
    styles: { font: 'times', fontSize: 8.5, cellPadding: 3, lineColor: [0, 0, 0], lineWidth: 0.4, textColor: [0, 0, 0], valign: 'top', overflow: 'linebreak' },
    headStyles: { fillColor: [192, 192, 192], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center', valign: 'middle' },
    columnStyles: { 0: { cellWidth: 54, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 66, halign: 'center' },
      3: { cellWidth: 52, halign: 'center' }, 4: { cellWidth: 56, halign: 'center', fontStyle: 'bold', textColor: [0, 0, 204] },
      5: { cellWidth: 36, halign: 'center' }, 6: { cellWidth: 52, halign: 'center' } },
    didParseCell: function (h) {
      if (h.section !== 'body') return;
      if (holRows[h.row.index]) h.cell.styles.fillColor = [217, 217, 217];
      if (h.row.index === lastIdx) {
        if (h.column.index < 4) { h.cell.styles.lineWidth = 0; h.cell.text = ['']; }
        if (h.column.index === 4) { h.cell.styles.fillColor = [192, 192, 192]; h.cell.styles.textColor = [0, 0, 0]; }
        h.cell.styles.fontStyle = 'bold';
      }
    }
  });

  var y = doc.lastAutoTable.finalY + 18;
  var needed = 22 + data.summary.length * 16;
  if (y + needed > doc.internal.pageSize.getHeight() - 30) { doc.addPage(); y = 40; }
  doc.setFillColor(255, 255, 0); doc.rect(M, y, W - 2 * M, 18, 'F');
  doc.setFont('times', 'bold'); doc.setFontSize(11);
  doc.text('SUMMARY', M + 8, y + 13); doc.text('#Days', 330, y + 13, { align: 'right' }); doc.text('%', 420, y + 13, { align: 'right' });
  doc.setFont('times', 'normal'); y += 34;
  data.summary.forEach(function (s) {
    doc.text(s.name, 110, y); doc.text(fmtDays(s.days), 330, y, { align: 'right' }); doc.text(fmtPct(s.days, data.total), 420, y, { align: 'right' });
    y += 16;
  });

  var pages = doc.internal.getNumberOfPages();
  for (var i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120, 120, 120);
    doc.text('Page ' + i + ' of ' + pages, W - M, doc.internal.pageSize.getHeight() - 16, { align: 'right' });
  }
  return doc;
}

function parseKey(k) { var p = k.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }

function ymShift(ym, n) { var p = ym.split('-'); var d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function round2(n) { return Math.round(n * 1000) / 1000; }

/* ---------- data ---------- */
function normSettings(s) {
  var d = clone(DEFAULT_SETTINGS); s = s || {};
  var strs = function (a, def) { return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string' && x.trim(); }) : def; };
  return {
    staffName: typeof s.staffName === 'string' ? s.staffName : d.staffName,
    titleLeft: typeof s.titleLeft === 'string' ? s.titleLeft : d.titleLeft,
    titleRight: typeof s.titleRight === 'string' ? s.titleRight : d.titleRight,
    customers: strs(s.customers, d.customers), categories: strs(s.categories, d.categories),
    leaves: Array.isArray(s.leaves) ? s.leaves.filter(function (l) { return l && typeof l.category === 'string'; })
      .map(function (l) { return { label: String(l.label || ''), category: l.category }; }) : d.leaves,
    spareRows: isFinite(+s.spareRows) ? Math.max(0, Math.min(50, Math.floor(+s.spareRows))) : d.spareRows,
    includeWeekdays: s.includeWeekdays !== false,
    useBotHolidays: s.useBotHolidays !== false,
    botBangkok: s.botBangkok !== false,
    customHolidays: Array.isArray(s.customHolidays) ? s.customHolidays.filter(function (c) { return c && /^\d{4}-\d{2}-\d{2}$/.test(c.date); })
      .map(function (c) { return { date: c.date, name: String(c.name || '') }; }) : []
  };
}
function toDoc(m) {
  var days = [];
  Object.keys(m.days).sort().forEach(function (k) {
    var v = m.days[k];
    if ((v.records && v.records.length) || v.holiday) days.push({ date: k, holiday: v.holiday || '', records: v.records || [] });
  });

}

}

function getDay(key) { var m = getMonth(key.slice(0, 7)); return m.days[key] || (m.days[key] = { holiday: '', records: [] }); }
function dayTotal(key) { var m = months[key.slice(0, 7)]; var d = m && m.days[key]; if (!d) return 0; return round2(d.records.reduce(function (a, r) { return a + (+r.days || 0); }, 0)); }

function loadLocal() {
  try {
    var raw = localStorage.getItem(LS_KEY); if (!raw) return;
    var o = JSON.parse(raw);
    settings = normSettings(o.settings);
    Object.keys(o.months || {}).forEach(function (ym) { months[ym] = fromDoc(o.months[ym]); });
  } catch (e) { /* storage unavailable */ }
}
function saveLocal() {
  try {
    var o = { settings: settings, months: {} };
    Object.keys(months).forEach(function (ym) { o.months[ym] = toDoc(months[ym]); });
    localStorage.setItem(LS_KEY, JSON.stringify(o));
  } catch (e) { /* ignore */ }
}

/* ---------- saving (browser + account) ---------- */
var writers = {}, saveTimer = null, dirtyMonths = {}, dirtySettings = false;
function setSync(t) { $('#sync').textContent = t; }
function remoteWrite(path, data) {
  var w = writers[path] || (writers[path] = { busy: false, next: null });
  w.next = data; if (!w.busy) pump(path);
}
function pump(path) {
  var w = writers[path]; w.busy = true;
  var d = w.next; w.next = null;
  db.doc(path).set(d).then(function () { setSync('Saved to your account'); }, function () { setSync('Saved in this browser only'); })
    .then(function () { if (w.next) pump(path); else w.busy = false; });
}
function markDirty(kind, ym) {

  setSync('Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
function flush() {
  saveLocal();
  if (db && uid) {
    if (dirtySettings) remoteWrite('data/users/' + uid + '/settings', clone(settings));
    Object.keys(dirtyMonths).forEach(function (ym) { remoteWrite('data/users/' + uid + '/m-' + ym, toDoc(getMonth(ym))); });
  } else setSync('Saved in this browser');
  dirtySettings = false; dirtyMonths = {};
}
function connectDb() {
  if (!window.claude || !window.claude.use) return;

    if (!r[0] || !r[1]) return null;
    return r[1].id().then(function (id) { if (!id) return null; db = r[0]; uid = id; return db.doc('data/users/' + uid + '/settings').get(); });
  }).then(function (snap) {

    return loadRemoteMonth(curYM);
  }).then(function () { if (db) { setSync('Saved to your account'); renderAll(); } })
    .catch(function () { setSync('Saved in this browser only'); });
}

/* ---------- calendar ---------- */
function renderCalendar() {
  var cal = $('#cal'); cal.textContent = '';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function (w) { cal.appendChild(h('div', { class: 'wd', text: w })); });
  var p = curYM.split('-'), y = +p[0], m = +p[1];

  for (var i = 0; i < offset; i++) cal.appendChild(h('div'));

    b.style.setProperty('--f', Math.min(tot, 1));

/* ---------- summary ---------- */
function renderSummary() {
  var only = viewScope();
  var data = computeSheet(settings, curYM, getMonth(curYM), only);
  $('#sumScope').textContent = !only ? 'whole month' : (!isMulti() ? fmtShort(only[0]) : only.length + (only.length === 1 ? ' selected day' : ' selected days'));
  var box = $('#sumRows'); box.textContent = '';

    var ws = wb.worksheets[0]; if (!ws) throw new Error('empty');
    var hdr = 0, col = { date: 2, desc: 3, ref: 4, cat: 5, cust: 6, days: 7 }, staff = null;
    for (var r = 1; r <= Math.min(20, ws.rowCount); r++) {
      ws.getRow(r).eachCell(function (c, ci) {
        var t = String(cellText(c.value)).trim(), lo = t.toLowerCase().replace(/\s+/g, ' ');
        if (/^staff name:/i.test(t)) staff = t.replace(/^staff name:\s*/i, '').trim();
        if (lo === 'job description') { hdr = r; col.desc = ci; }
        if (hdr === r || lo === 'job description') {
          if (lo === 'date') col.date = ci;
          else if (lo.indexOf('ir/cr') === 0) col.ref = ci;
          else if (lo === 'category') col.cat = ci;
          else if (lo === 'customer') col.cust = ci;
          else if (/days/.test(lo)) col.days = ci;
        }
      });
    }
    if (!hdr) throw new Error('nohdr');
    // second pass on header row for columns left of "Job Description"
    ws.getRow(hdr).eachCell(function (c, ci) {
      var lo = String(cellText(c.value)).trim().toLowerCase().replace(/\s+/g, ' ');
      if (lo === 'date') col.date = ci; else if (lo.indexOf('ir/cr') === 0) col.ref = ci;
      else if (lo === 'category') col.cat = ci; else if (lo === 'customer') col.cust = ci; else if (/days/.test(lo)) col.days = ci;
    });
    var cur = null, out = {}, counts = {}, newCust = [], newCat = [];
    for (var rr = hdr + 1; rr <= ws.rowCount; rr++) {
      var row = ws.getRow(rr);
      var g = function (k) { return cellText(row.getCell(col[k]).value); };
      var stop = false;
      row.eachCell(function (c) { var t = String(cellText(c.value)).trim().toUpperCase(); if (t === 'TOTAL' || t === 'SUMMARY') stop = true; });
      if (stop) break;
      var dk = toDateKey(row.getCell(col.date).value);
      if (dk) { cur = dk; counts[dk.slice(0, 7)] = (counts[dk.slice(0, 7)] || 0) + 1; }
      if (!cur) continue;
      var desc = String(g('desc')).trim(), ref = String(g('ref')).trim(), cat = String(g('cat')).trim(), cust = String(g('cust')).trim();
      var dv = g('days'), days = dv === '' ? '' : +dv;
      if (isNaN(days)) days = '';
      var day = out[cur] || (out[cur] = { holiday: '', records: [] });
      if (!desc && !ref && !cat && !cust && days === '') continue;
      if (desc && !ref && !cat && !cust && days === '') { day.holiday = desc; continue; }
      day.records.push({ id: rid(), desc: desc, ref: ref, cat: cat, cust: cust, days: days });
      if (cust && settings.customers.indexOf(cust) < 0 && newCust.indexOf(cust) < 0) newCust.push(cust);
      if (cat && settings.categories.indexOf(cat) < 0 && newCat.indexOf(cat) < 0) newCat.push(cat);
    }
    var ym = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
    if (!ym) throw new Error('nodates');
    var n = 0; Object.keys(out).forEach(function (k) { if (k.slice(0, 7) === ym) n += out[k].records.length; });
    var p = ym.split('-');
    var existing = toDoc(getMonth(ym)).days.length;
    var apply = function () {
      var m = { days: {} }; Object.keys(out).forEach(function (k) { if (k.slice(0, 7) === ym) m.days[k] = out[k]; });
      months[ym] = m; remoteLoaded[ym] = true;
      newCust.forEach(function (c) { settings.customers.push(c); }); newCat.forEach(function (c) { settings.categories.push(c); });
      if (staff && !settings.staffName) settings.staffName = staff;
      if (newCust.length || newCat.length || staff) markDirty('settings');
      markDirty('month', ym); goMonth(ym);
      toast('Imported ' + n + ' entries for ' + MONTHS_LONG[+p[1] - 1] + ' ' + p[0] + '.');
    };
    if (existing) ask('Replace ' + MONTHS_LONG[+p[1] - 1] + ' ' + p[0] + '?', 'This file has ' + n + ' entries. They’ll replace what you’ve already entered for that month.', apply);
    else apply();
  }).catch(function () { toast('Couldn’t read that file. Use a timesheet in this Job-D format (.xlsx).'); });
}

/* ---------- wire up ---------- */
loadLocal();
curYM = todayKey().slice(0, 7); selDate = todayKey();
$('#cal').addEventListener('keydown', function (e) {
  var cur = e.target.closest && e.target.closest('.day'); if (!cur) return;
  var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
  var days = Array.prototype.slice.call(document.querySelectorAll('#cal .day'));
  var idx = days.indexOf(cur), next = null;
  if (step) next = days[Math.max(0, Math.min(days.length - 1, idx + step))];
  else if (e.key === 'Home') next = days[0]; else if (e.key === 'End') next = days[days.length - 1];
  if (!next) return;
  e.preventDefault(); days.forEach(function (d) { d.tabIndex = -1; }); next.tabIndex = 0; next.focus();
});
$('#prevM').addEventListener('click', function () { goMonth(ymShift(curYM, -1)); });
$('#nextM').addEventListener('click', function () { goMonth(ymShift(curYM, 1)); });
$('#monthPick').addEventListener('change', function (e) { goMonth(e.target.value); });
$('#download').addEventListener('click', openExport);
$('#openSettings').addEventListener('click', function () { renderSettings(); openOv('#settingsOv'); });
document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { closeOv('#settingsOv'); renderAll(); }); });
$('#settingsOv').addEventListener('click', function (e) { if (e.target.id === 'settingsOv') { closeOv('#settingsOv'); renderAll(); } });
$('#exNo').addEventListener('click', function () { closeOv('#exportOv'); });
$('#exportOv').addEventListener('click', function (e) { if (e.target.id === 'exportOv') closeOv('#exportOv'); });
$('#cfNo').addEventListener('click', function () { closeOv('#confirmOv'); cfCb = null; });
$('#cfAlt').addEventListener('click', function () { closeOv('#confirmOv'); var c = cfAlt; cfAlt = null; cfCb = null; if (c) c(); });
$('#cfYes').addEventListener('click', function () { closeOv('#confirmOv'); var c = cfCb; cfCb = null; if (c) c(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if ($('#exportOv').classList.contains('open')) closeOv('#exportOv'); else if ($('#confirmOv').classList.contains('open')) closeOv('#confirmOv'); else if ($('#settingsOv').classList.contains('open')) { closeOv('#settingsOv'); renderAll(); } }
});
$('#importLbl').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#importFile').click(); } });
$('#importFile').addEventListener('change', function (e) { var f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('beforeunload', flush);
function measureBar() { document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px'); }
window.addEventListener('resize', measureBar); measureBar();
renderAll();
connectDb();
})();
